<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ドパガキ脱出！！</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://koshinstudio.com/works/dopagaki/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* One committed world: a toy diorama under arcade lights. Full-bleed 3D stage; status pinned top,
     the three verbs pinned bottom, manga sound-words float over the action. */
  --ink: #14092b;
  --paper: #fff6dc;
  --zap: #ffe030;
  --hot: #ff2e7e;
  --cyan: #5fe3ff;
  --violet: #3a1f7a;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", "IPAGothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "IPAGothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body); font-weight: 700;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx-layer, #hud, #flash, #fade { position: absolute; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

/* ---------- manga sound words ---------- */
.pop {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font-family: var(--display); color: var(--zap); line-height: 1;
  -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
  text-shadow: 3px 4px 0 var(--hot);
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  animation: pop .72s cubic-bezier(.2, .9, .3, 1) forwards;
  will-change: transform, opacity;
}
.pop.small { color: #fff; -webkit-text-stroke-width: 5px; text-shadow: 2px 3px 0 var(--violet); animation-duration: .5s; }
.pop.big { color: #fff; text-shadow: 4px 5px 0 var(--hot), -3px -2px 0 var(--zap); animation-duration: 1s; }
@keyframes pop {
  0% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(.2); opacity: 0; }
  18% { transform: translate(-50%, -62%) rotate(var(--rot)) scale(1.28); opacity: 1; }
  34% { transform: translate(-50%, -66%) rotate(var(--rot)) scale(1); }
  78% { opacity: 1; }
  100% { transform: translate(-50%, -105%) rotate(var(--rot)) scale(.96); opacity: 0; }
}
#bubble {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%) scale(.6); transform-origin: 50% 100%;
  max-width: min(70vw, 300px); padding: 8px 14px; border-radius: 16px;
  background: #fff; color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 4px 0 var(--ink);
  font-size: 15px; font-weight: 900; line-height: 1.35; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .12s, transform .16s cubic-bezier(.3, 1.6, .5, 1);
}
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 14px; height: 14px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
#bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }

/* ---------- HUD ---------- */
#hud { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.room { display: flex; flex-direction: column; gap: 1px; }
#room-no { font-size: 12px; letter-spacing: .14em; color: var(--zap); }
#room-name { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 5.6vw, 26px); line-height: 1.1; white-space: nowrap; text-shadow: 2px 3px 0 var(--ink); }
.right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
#mission-mini { position: absolute; left: 50%; bottom: clamp(92px, 13%, 124px); width: min(88%, 460px); transform: translateX(-50%); pointer-events: none;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 5px 0 var(--ink); padding: 10px 14px 9px; }
#mission-mini small { display: block; font-size: 10px; letter-spacing: .18em; color: #b3261e; }
#mini-text { font-size: 15px; font-weight: 900; line-height: 1.4; color: #8d8371; text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: 3px; }
#mini-stamp { position: absolute; right: -6px; top: -27px; padding: 1px 9px 3px; background: var(--hot); color: #fff; border: 3px solid var(--ink); box-shadow: 2px 3px 0 var(--ink);
  font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.25; transform: rotate(-5deg); white-space: nowrap; }
@media (min-aspect-ratio: 1/1) { #mission-mini { left: 14px; bottom: 14px; width: min(34%, 340px); transform: none; } #mini-text { font-size: 13px; } }
#timer { font-family: var(--display); font-size: clamp(18px, 5.4vw, 24px); font-variant-numeric: tabular-nums; text-shadow: 2px 3px 0 var(--ink); min-width: 2.6em; text-align: right; }
#tip { position: absolute; right: 14px; top: clamp(118px, 17%, 150px); font-family: var(--display); font-size: 14px; padding: 5px 13px 7px; background: var(--zap); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 2px 3px 0 var(--ink); }
#mute, #tomap { pointer-events: auto; white-space: nowrap; background: rgba(20, 9, 43, .7); border: 2px solid rgba(255, 246, 220, .5); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 900; }
.gauge { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); margin: 0 auto; }
.g-label { font-size: 12px; font-weight: 900; letter-spacing: .06em; white-space: nowrap; text-shadow: 1px 2px 0 var(--ink); width: 5.2em; }
.g-bar { flex: 1; height: 18px; background: rgba(20, 9, 43, .78); border: 3px solid var(--ink); outline: 2px solid var(--paper); transform: skewX(-16deg); overflow: hidden; }
.g-bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transition: transform .12s linear;
  background: repeating-linear-gradient(90deg, var(--zap) 0 14px, #ffc400 14px 28px); }
#dopa.low .g-bar i { background: repeating-linear-gradient(90deg, var(--hot) 0 14px, #ff7aa8 14px 28px); animation: blink .28s steps(2) infinite; }
#dopa.low .g-label { color: var(--hot); }
#noise .g-bar { height: 12px; }
#noise .g-bar i { background: var(--cyan); }
#noise.hot .g-bar i { background: #ff4a3a; }
#noise.good .g-bar i { background: var(--hot); }
@keyframes blink { 50% { opacity: .45; } }
#combo {
  align-self: flex-end; margin-right: max(0px, calc((100% - 560px) / 2));
  font-family: var(--display); font-size: 30px; color: var(--zap); line-height: 1;
  -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--hot);
  transform: rotate(-6deg); opacity: 0; transition: opacity .2s;
}
#combo.show { opacity: 1; }
#combo.bump { animation: bump .16s ease-out; }
@keyframes bump { 0% { transform: rotate(-6deg) scale(1.45); } 100% { transform: rotate(-6deg) scale(1); } }
#chips { margin-top: auto; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-bottom: 4px; }
.chip {
  display: flex; flex-direction: column; align-items: center; min-width: 92px; padding: 6px 12px 7px;
  background: rgba(20, 9, 43, .78); border: 2px solid rgba(255, 246, 220, .38); border-radius: 12px;
  font-size: 15px; font-weight: 900; line-height: 1.2; color: rgba(255, 246, 220, .75);
}
.chip b { font-size: 10px; letter-spacing: .1em; font-weight: 700; opacity: .8; }
.chip.on { background: var(--zap); color: var(--ink); border-color: var(--ink); box-shadow: 3px 4px 0 var(--ink); animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-5px) rotate(-2deg); } }

/* ---------- mission banner ---------- */
#banner {
  position: absolute; left: 50%; top: 42%; width: min(88%, 460px); transform: translate(-50%, -50%); transform-origin: 0 0;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 5px 6px 0 var(--ink);
  padding: 12px 16px 14px; opacity: 0; pointer-events: none;
}
#banner small { display: block; font-size: 11px; letter-spacing: .2em; color: #b3261e; margin-bottom: 4px; }
#mission-text { position: relative; display: inline; font-size: 17px; font-weight: 900; line-height: 1.5; text-wrap: balance; }
#stamp {
  position: absolute; right: -8px; bottom: -22px; padding: 4px 12px 6px; background: var(--hot); color: #fff;
  border: 3px solid var(--ink); font-family: var(--display); font-size: 22px; line-height: 1.2; transform: rotate(-7deg); opacity: 0;
  box-shadow: 3px 4px 0 var(--ink);
}
#banner.show { animation: banner 1.6s forwards; }
#banner.show #mission-text { animation: strike .15s .68s forwards; }
#banner.show #stamp { animation: stamp .2s .6s cubic-bezier(.3, 1.5, .5, 1) forwards; }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, calc(-50% - 14px)); }
  9%, 80% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--sc, .4)); }
}
@keyframes minifade { from { opacity: 0; } to { opacity: 1; } }
#mission-mini.late { animation: minifade .25s 1.4s both; }
@keyframes strike { to { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--hot); color: #8d8371; } }
@keyframes stamp { 0% { opacity: 0; transform: rotate(-7deg) scale(2.6); } 100% { opacity: 1; transform: rotate(-7deg) scale(1); } }

#escape { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none; white-space: nowrap; }
#escape b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(64px, 19vw, 150px); line-height: 1; color: var(--zap);
  -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 6px 8px 0 var(--hot); }
#escape span { display: inline-block; margin-top: 10px; padding: 3px 14px; background: var(--ink); border: 2px solid var(--zap); font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
#escape.show { animation: escape 1.2s .22s cubic-bezier(.2, 1.2, .3, 1) forwards; }
@keyframes escape { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-10deg); } 22% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-5deg); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-5deg); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3) rotate(-5deg); } }

/* ---------- doomscroll card ---------- */
#phone { position: absolute; left: 50%; bottom: clamp(178px, 25%, 220px); transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
  background: var(--ink); border: 3px solid var(--cyan); border-radius: 14px; padding: 10px 14px 10px 10px; box-shadow: 0 0 28px rgba(95, 227, 255, .5); pointer-events: none; }
.reel { width: 40px; height: 66px; border-radius: 7px; overflow: hidden; border: 2px solid #000; background: #000; }
.reel i { display: block; height: 400%; background: linear-gradient(#ff2e7e 0 12.5%, #ffe030 0 25%, #5fe3ff 0 37.5%, #8d4fd1 0 50%, #2fa56a 0 62.5%, #f07a3a 0 75%, #ff2e7e 0 87.5%, #ffe030 0); animation: reel 1.1s steps(7) infinite; }
@keyframes reel { to { transform: translateY(-87.5%); } }
#phone p { font-size: 14px; line-height: 1.4; font-weight: 900; }
#phone small { display: block; font-size: 11px; color: var(--cyan); letter-spacing: .08em; }
#phone-t { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--cyan); }

#charge { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; pointer-events: none; opacity: 0;
  border: 6px solid var(--zap); box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 4px var(--ink); transform: scale(calc(.45 + var(--p, 0) * .75)); }
#charge.on { opacity: 1; }
#charge::after { content: "叫"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 34px; color: var(--zap); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }

#watch { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: inset 0 0 0 6px #ff2a2a, inset 0 0 90px rgba(255, 42, 42, .55); display: flex; justify-content: center; align-items: flex-start; }
#watch.on { opacity: 1; }
#watch span { margin-top: clamp(128px, 20%, 170px); padding: 4px 16px 7px; background: #ff2a2a; color: #fff; border: 3px solid var(--ink); box-shadow: 3px 4px 0 var(--ink); font-family: var(--display); font-size: clamp(18px, 5.4vw, 26px); transform: rotate(-3deg); }
#flash { opacity: 0; background: #fff; }
#fade { background: #fffbe6; opacity: 0; transition: opacity .36s ease; }
#fade.dark { background: var(--ink); }
#fade.on { opacity: 1; }

/* ---------- title & result ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(18px, 5vh, 44px) clamp(18px, 6vw, 64px); }
#title { background: linear-gradient(180deg, rgba(20, 9, 43, .9) 0%, rgba(20, 9, 43, .35) 34%, rgba(20, 9, 43, 0) 52%, rgba(20, 9, 43, .78) 82%, rgba(20, 9, 43, .96) 100%); }
.kicker { display: inline-block; background: var(--hot); color: #fff; border: 3px solid var(--ink); padding: 2px 12px 4px; font-size: clamp(13px, 3.6vw, 18px); font-weight: 900; transform: rotate(-4deg); margin-left: 4px; }
.logo { font-family: var(--display); font-weight: 400; font-size: clamp(54px, 17.5vw, 132px); line-height: .98; color: var(--zap); transform: rotate(-4deg) skewX(-6deg); transform-origin: 0 50%;
  -webkit-text-stroke: clamp(9px, 2.4vw, 16px) var(--ink); paint-order: stroke fill; text-shadow: clamp(4px, 1.2vw, 9px) clamp(5px, 1.5vw, 11px) 0 var(--hot); margin-top: 6px; }
.logo span { display: block; }
.logo span + span { color: #fff; margin-left: .5em; }
.tag { margin-top: clamp(10px, 2.5vh, 22px); font-size: clamp(15px, 4.2vw, 22px); font-weight: 900; letter-spacing: .05em; text-shadow: 2px 3px 0 var(--ink); }
.title-bottom { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.how { list-style: none; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.how li { background: rgba(20, 9, 43, .8); border: 2px solid rgba(255, 246, 220, .4); border-radius: 12px; padding: 6px 12px 7px; font-size: 15px; font-weight: 900; line-height: 1.25; }
.how b { display: block; font-size: 10px; letter-spacing: .1em; color: var(--zap); }
#start, #again {
  font-family: var(--display); font-size: clamp(22px, 6.4vw, 30px); padding: 12px 34px 15px; background: var(--hot); color: #fff;
  border: 4px solid var(--ink); border-radius: 16px; box-shadow: 5px 7px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
#start:hover, #again:hover { transform: translate(-1px, -2px); box-shadow: 6px 9px 0 var(--ink); }
#start:active, #again:active { transform: translate(3px, 5px); box-shadow: 2px 2px 0 var(--ink); }
#map { background: rgba(20, 9, 43, .84); justify-content: flex-start; gap: clamp(12px, 3vh, 26px); overflow-y: auto; }
.map-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.map-title { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 7.4vw, 40px); line-height: 1.1; color: var(--zap); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--hot); transform: rotate(-3deg); }
#map-back { background: transparent; border: 2px solid rgba(255, 246, 220, .5); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 900; white-space: nowrap; }
#worlds { display: flex; flex-direction: column; gap: clamp(12px, 3vh, 26px); width: min(100%, 620px); margin: 0 auto; }
.world { background: rgba(58, 31, 122, .5); border: 3px solid var(--ink); outline: 2px solid rgba(255, 246, 220, .28); border-radius: 18px; padding: 12px 8px 10px; }
.world h2 { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 15px; font-weight: 900; }
.world h2 span { font-family: var(--display); font-weight: 400; font-size: 18px; background: var(--hot); color: #fff; border: 3px solid var(--ink); padding: 0 10px 3px; transform: rotate(-3deg); }
.path { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); padding: 34px 0 6px; }
.path.short svg { display: none; }
.path svg { position: absolute; left: 0; top: 34px; width: 100%; height: 100px; }
.path polyline { fill: none; stroke: rgba(255, 246, 220, .55); stroke-width: 5; stroke-dasharray: 2 12; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; padding: 0; height: 122px; }
.node:nth-child(odd) { padding-top: 28px; }
.node b { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; font-family: var(--display); font-weight: 400; font-size: 15px;
  background: var(--zap); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform .08s; }
.node:nth-child(even) b { margin-top: 0; }
.node span { font-size: 12px; font-weight: 900; line-height: 1.2; text-shadow: 1px 2px 0 var(--ink); }
.node i { font-style: normal; font-size: 10px; font-variant-numeric: tabular-nums; color: rgba(255, 246, 220, .7); }
.node.current b { background: var(--hot); color: #fff; animation: nodepulse 1s ease-in-out infinite; }
.node.locked b { background: rgba(20, 9, 43, .8); color: rgba(255, 246, 220, .35); border-color: rgba(255, 246, 220, .25); box-shadow: none; }
.node.locked span { color: rgba(255, 246, 220, .4); }
.node:not(:disabled):active b { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
@keyframes nodepulse { 50% { box-shadow: 0 5px 0 var(--ink), 0 0 0 7px rgba(255, 46, 126, .35); } }
.kidico { position: absolute; left: 50%; top: -6px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #ffcfa3; border: 2px solid var(--ink); border-top: 9px solid #2b1b3d; animation: hop .5s ease-in-out infinite alternate; }
.node:nth-child(even) .kidico { top: -34px; }
.kidico::after { content: ""; position: absolute; left: -3px; top: 11px; width: 24px; height: 11px; background: #ffd21f; border: 2px solid var(--ink); border-radius: 6px 6px 3px 3px; }
@keyframes hop { to { transform: translateY(-7px); } }
#r-head { font-size: 12px; font-weight: 900; letter-spacing: .12em; color: #b3261e; margin-bottom: 8px; }
.note { font-size: 12px; opacity: .7; font-weight: 500; }

#result { background: rgba(20, 9, 43, .86); justify-content: center; align-items: center; gap: 18px; overflow-y: auto; }
.card { width: min(100%, 440px); background: var(--paper); color: var(--ink); border: 4px solid var(--ink); box-shadow: 7px 9px 0 var(--hot); padding: 18px 20px 20px; }
.rank-row { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid var(--ink); padding-bottom: 12px; }
#rank { font-family: var(--display); font-size: 92px; line-height: .9; color: var(--hot); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; transform: rotate(-6deg); }
.rank-row small { font-size: 11px; letter-spacing: .18em; color: #6a5f80; }
#rank-title { font-family: var(--display); font-size: 26px; line-height: 1.15; }
#rank-note { font-size: 13px; line-height: 1.5; margin-top: 4px; font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 14px; }
.stats div { display: flex; flex-direction: column; }
.stats dt { font-size: 11px; letter-spacing: .08em; color: #6a5f80; }
.stats dd { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
#copy { background: transparent; border: 3px solid var(--paper); border-radius: 14px; padding: 10px 18px 12px; font-weight: 900; font-size: 15px; }

@media (min-aspect-ratio: 1/1) {
  #title { background: linear-gradient(90deg, rgba(20, 9, 43, .94) 0%, rgba(20, 9, 43, .6) 36%, rgba(20, 9, 43, 0) 62%); }
  .logo { font-size: clamp(54px, 9.5vw, 132px); }
}
@media (max-height: 520px) { .how { display: none; } #phone { bottom: 70px; } }
@media (prefers-reduced-motion: reduce) {
  .chip.on, #dopa.low .g-bar i, .reel i, .node.current b, .kidico { animation: none; }
  .pop { animation-duration: .5s; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="ドパガキ脱出のゲーム画面"></canvas>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="bubble" aria-live="polite"></div>

  <div id="hud" hidden>
    <div class="top">
      <div class="room"><span id="room-no">STAGE 1-1</span><b id="room-name">書斎</b></div>
      <div class="right"><span id="timer">0.0</span><button id="mute" type="button" aria-pressed="false">音 ON</button><button id="tomap" type="button">マップ</button></div>
    </div>
    <div id="dopa" class="gauge"><span class="g-label">ドーパミン</span><div class="g-bar"><i id="dopa-fill"></i></div></div>
    <div id="noise" class="gauge" hidden><span class="g-label" id="noise-label">騒音</span><div class="g-bar"><i id="noise-fill" style="transform:scaleX(0)"></i></div></div>
    <div id="combo" aria-hidden="true"></div>
    <div id="chips">
      <div class="chip" data-k="tap"><b>タップ</b>殴る</div>
      <div class="chip" data-k="swipe"><b>スワイプ</b>投げる</div>
      <div class="chip" data-k="hold"><b>長押し</b>叫ぶ</div>
    </div>
  </div>

  <div id="mission-mini" hidden><small>本来のルール</small><s id="mini-text"></s><b id="mini-stamp"></b></div>
  <div id="banner"><small>MISSION</small><span id="mission-text"></span><div id="stamp"></div></div>
  <div id="escape"><b>脱出！！</b><span id="escape-time">0.0</span></div>
  <div id="phone" hidden><div class="reel"><i></i></div><p><small>ドーパミン切れ</small>ショート動画を見ています… <span id="phone-t">2.6</span></p></div>
  <button id="tip" type="button" hidden>ヒント</button>
  <div id="watch" aria-hidden="true"><span>見られてる。動くな</span></div>
  <div id="charge"></div>
  <div id="flash"></div>
  <div id="fade"></div>

  <div id="title" class="screen">
    <div>
      <p class="kicker">謎解き、全部スキップ。</p>
      <h1 class="logo"><span>ドパガキ</span><span>脱出！！</span></h1>
      <p class="tag">読まない。待てない。考えない。</p>
    </div>
    <div class="title-bottom">
      <button id="start" type="button">はじめる</button>
      <p class="note">音が出ます。STAGE 1〜200、全1000コース。</p>
    </div>
  </div>


  <div id="map" class="screen" hidden>
    <div class="map-head"><h2 class="map-title">コースをえらぶ</h2><button id="map-back" type="button">タイトルへ</button></div>
    <div id="worlds"></div>
    <p class="note"><span id="map-more"></span> えらんだコースから、そのSTAGEの最後まで続けて遊びます。</p>
  </div>

  <div id="result" class="screen" hidden>
    <div class="card">
      <p id="r-head"></p>
      <div class="rank-row">
        <div id="rank">S</div>
        <div><small>ドパガキ度</small><div id="rank-title"></div><p id="rank-note"></p></div>
      </div>
      <dl class="stats">
        <div><dt>タイム</dt><dd id="r-time"></dd></div>
        <div><dt>破壊率</dt><dd id="r-rate"></dd></div>
        <div><dt>最大コンボ</dt><dd id="r-combo"></dd></div>
        <div><dt>読み捨てたヒント</dt><dd id="r-hints"></dd></div>
        <div><dt>スマホを見た</dt><dd id="r-phone"></dd></div>
        <div><dt>捕まった</dt><dd id="r-caught"></dd></div>
      </dl>
    </div>
    <div class="actions">
      <button id="again" type="button">コース選択へ</button>
      <button id="copy" type="button">結果をコピー</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
