# ドパガキ脱出！！：このブランチに push されたら、組み立てて Pages（dopagaki）に出す。
# koshinstudio.com/play/dopagaki/ は、サイト側の worker/ がここ（dopagaki.pages.dev）へ中継する。
name: deploy-dopagaki
on:
  push:
    branches: [game-dopagaki]
  workflow_dispatch:
concurrency: { group: deploy-dopagaki, cancel-in-progress: false }
env:
  CLOUDFLARE_ACCOUNT_ID: 819c918e8d9f77952de1623c1b0f1a5c
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 組み立て
        run: npm ci && npm run build
      - name: Pages プロジェクトを用意（初回だけ作られる。本番ブランチは main）
        run: npx -y wrangler@3 pages project create dopagaki --production-branch main || echo "既にある"
      - name: 出す（--branch main を落とさない。落とすと preview に入る）
        run: npx -y wrangler@3 pages deploy dist --project-name dopagaki --branch main --commit-dirty=true
      # dopagaki.pages.dev は他の人が先に取っていたので、このプロジェクトの住所は別の名前になる。
      # 本当の住所を API で聞いて、PAGES_HOST に書き残す（worker/ の ROUTES はこれを見て書く）
      - name: 住所を聞く
        run: |
          host=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dopagaki" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          echo "住所: $host"; echo "HOST=$host" >> "$GITHUB_ENV"
      - name: 出たか確かめる
        run: |
          sleep 20
          for u in / /game.js; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOST$u"); echo "$c $u"; [ "$c" = 200 ] || exit 1
          done
          curl -s "https://$HOST/" | grep -q 'ドパガキ脱出' || { echo "別の中身が出ている"; exit 1; }
      - name: 住所を書き残す
        run: |
          echo "$HOST" > PAGES_HOST
          if ! git diff --quiet -- PAGES_HOST 2>/dev/null || ! git ls-files --error-unmatch PAGES_HOST >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PAGES_HOST && git commit -m "Pages の住所を記録 [skip ci]" && git push
          fi
